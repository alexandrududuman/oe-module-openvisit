name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests on PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer validate --strict --no-check-lock
      - run: composer install --no-interaction --no-progress
      - run: composer audit
      - run: composer cs
      - run: composer test

  phpstan:
    name: PHPStan against OpenEMR 8.5
    runs-on: ubuntu-24.04
    env:
      OPENEMR_ROOT: ${{ github.workspace }}/openemr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: openemr/openemr
          ref: v8_5_0
          path: openemr
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - uses: actions/cache@v4
        with:
          path: openemr/vendor
          key: openemr-vendor-${{ hashFiles('openemr/composer.lock') }}
      - name: Install OpenEMR dependencies
        working-directory: openemr
        run: composer install --no-dev --no-scripts --no-interaction --no-progress --ignore-platform-reqs
      - run: composer install --no-interaction --no-progress
      - run: composer phpstan

  e2e:
    name: Browser journeys against OpenEMR 8.5 and Jitsi
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      OPENEMR_HTTP_PORT: '8300'
      JITSI_HTTPS_PORT: '8443'
      JITSI_JWT_SECRET: openvisit-e2e-secret-change-me-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Boot OpenEMR, demo data, module and Jitsi
        run: tests/e2e/stack/up.sh
      - name: Run the journeys
        run: npm run e2e:stack
      - name: Stack logs on failure
        if: failure()
        run: docker compose -f tests/e2e/stack/docker-compose.yml logs --tail 200
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results-journeys
          path: |
            tests/e2e/results
            tests/e2e/report
          retention-days: 7

  install:
    name: Install on OpenEMR ${{ matrix.openemr }} (${{ matrix.method }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { openemr: '8.5.0', method: copy }
          - { openemr: '8.5.0', method: composer }
          - { openemr: '8.5.0', method: upgrade }
          - { openemr: next, method: copy }
          - { openemr: '8.2.0', method: copy }
          - { openemr: '8.0.0', method: copy, unsupported: '1' }
    env:
      OPENEMR_TAG: ${{ matrix.openemr }}
      EXPECT_UNSUPPORTED: ${{ matrix.unsupported || '0' }}
      JITSI_DOMAIN: localhost:8443
      JITSI_JWT_SECRET: openvisit-e2e-secret-change-me-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start Jitsi
        run: |
          docker compose -f tests/e2e/stack/docker-compose.yml up -d jitsi-web jitsi-prosody jitsi-jicofo jitsi-jvb
          for i in $(seq 1 60); do curl -skf -o /dev/null https://localhost:8443/external_api.js && break; sleep 5; done
      - name: Install on a pristine OpenEMR and run a first visit
        run: tests/e2e/install/run.sh ${{ matrix.method }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results-install-${{ matrix.openemr }}-${{ matrix.method }}
          path: tests/e2e/results
          retention-days: 7
