# Throwaway stack for the browser journeys: OpenEMR 8.5 (official image) with the module
# mounted in, MariaDB, Jitsi Meet with JWT auth and a Jibri recorder. Used by CI and by
# `npm run stack:up`.
name: openvisit-e2e

services:
  mysql:
    image: mariadb:11.4
    command: ['mariadbd', '--character-set-server=utf8mb4', '--collation-server=utf8mb4_general_ci']
    environment:
      MARIADB_ROOT_PASSWORD: root
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 5s
      timeout: 5s
      retries: 30

  openemr:
    image: openemr/openemr:8.5.0
    ports:
      - '${OPENEMR_HTTP_PORT:-8300}:80'
      - '${OPENEMR_HTTPS_PORT:-9300}:443'
    volumes:
      - ../../..:/var/www/localhost/htdocs/openemr/interface/modules/custom_modules/oe-module-openvisit:ro
      - recordings:/var/openvisit
    environment:
      MYSQL_HOST: mysql
      MYSQL_ROOT_PASS: root
      MYSQL_USER: openemr
      MYSQL_PASS: openemr
      OE_USER: admin
      OE_PASS: pass
    depends_on:
      mysql:
        condition: service_healthy

  # --- Jitsi Meet (official images) with JWT auth and token-based moderator role ---
  jitsi-web:
    image: ghcr.io/jitsi/web:${JITSI_VERSION:-stable-11248-3}
    ports:
      - '${JITSI_HTTPS_PORT:-8443}:8443'
    environment: &jitsi-env
      TZ: UTC
      PUBLIC_URL: https://localhost:${JITSI_HTTPS_PORT:-8443}
      ENABLE_AUTH: 1
      ENABLE_GUESTS: 0
      AUTH_TYPE: jwt
      # Roles come from the JWT moderator claim only (token_affiliation). With jicofo's own JWT
      # authentication or auto-owner, every patient and guest would become a moderator.
      JICOFO_ENABLE_AUTH: 0
      ENABLE_AUTO_OWNER: 0
      JWT_APP_ID: ${JITSI_APP_ID:-openvisit}
      JWT_APP_SECRET: ${JITSI_JWT_SECRET:-openvisit-e2e-secret-change-me-0123456789abcdef}
      ENABLE_LOBBY: 1
      ENABLE_RECORDING: 1
      ENABLE_XMPP_WEBSOCKET: 1
      XMPP_MUC_MODULES: token_affiliation,openvisit_lobby_bypass
      XMPP_DOMAIN: meet.jitsi
      XMPP_AUTH_DOMAIN: auth.meet.jitsi
      XMPP_GUEST_DOMAIN: guest.meet.jitsi
      XMPP_MUC_DOMAIN: muc.meet.jitsi
      XMPP_INTERNAL_MUC_DOMAIN: internal-muc.meet.jitsi
      XMPP_HIDDEN_DOMAIN: hidden.meet.jitsi
      XMPP_SERVER: xmpp.meet.jitsi
      XMPP_BOSH_URL_BASE: http://xmpp.meet.jitsi:5280
      JICOFO_AUTH_PASSWORD: ${JICOFO_AUTH_PASSWORD:-e2ejicofo0123456789abcdef}
      JVB_AUTH_PASSWORD: ${JVB_AUTH_PASSWORD:-e2ejvb0123456789abcdef}
      JIBRI_XMPP_PASSWORD: ${JIBRI_XMPP_PASSWORD:-e2ejibri0123456789abcdef}
      JIBRI_RECORDER_PASSWORD: ${JIBRI_RECORDER_PASSWORD:-e2erecorder0123456789abcdef}
      JIBRI_BREWERY_MUC: jibribrewery
      JVB_BREWERY_MUC: jvbbrewery
      JVB_PORT: 10000
    depends_on:
      - jitsi-prosody
    networks:
      meet.jitsi:

  jitsi-prosody:
    image: ghcr.io/jitsi/prosody:${JITSI_VERSION:-stable-11248-3}
    expose: ['5222', '5280']
    volumes:
      - ../../../docker/prosody/mod_openvisit_lobby_bypass.lua:/prosody-plugins-custom/mod_openvisit_lobby_bypass.lua:ro
    environment: *jitsi-env
    networks:
      meet.jitsi:
        aliases: [xmpp.meet.jitsi]

  jitsi-jicofo:
    image: ghcr.io/jitsi/jicofo:${JITSI_VERSION:-stable-11248-3}
    environment: *jitsi-env
    depends_on:
      - jitsi-prosody
    networks:
      meet.jitsi:

  jitsi-jvb:
    image: ghcr.io/jitsi/jvb:${JITSI_VERSION:-stable-11248-3}
    ports:
      - '${JVB_PORT:-10000}:10000/udp'
    environment: *jitsi-env
    depends_on:
      - jitsi-prosody
    networks:
      meet.jitsi:

  # Shares the web container's network so the meeting URL https://localhost:8443 works inside it.
  jitsi-jibri:
    image: ghcr.io/jitsi/jibri:${JITSI_VERSION:-stable-11248-3}
    network_mode: service:jitsi-web
    shm_size: 2gb
    cap_add: [SYS_ADMIN]
    volumes:
      - recordings:/storage
      - ../../../docker/jibri/finalize.sh:/opt/openvisit/finalize.sh:ro
    environment:
      <<: *jitsi-env
      JIBRI_RECORDING_DIR: /storage/recordings
      JIBRI_FINALIZE_RECORDING_SCRIPT_PATH: /opt/openvisit/finalize.sh
      JIBRI_STRIP_DOMAIN_JID: muc
      IGNORE_CERTIFICATE_ERRORS: 1
      DISPLAY: ':0'
    depends_on:
      - jitsi-jicofo

volumes:
  recordings:

networks:
  meet.jitsi:
